# Put the map in nginx's http {} block. It prevents bearer stream tickets from
# ending up in the dashboard access log.
map $uri $atum3d_loggable {
    default 1;
    ~^/smart-module-stream/ 0;
}

# Add these directives to the dashboard server {} block.
access_log /var/log/nginx/atum3d-access.log combined if=$atum3d_loggable;

location /smart-module-stream/ {
    access_log off;
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 3700s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}

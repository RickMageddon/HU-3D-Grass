services:
  printfarm-manager:
    build: .
    ports:
      - "${MANAGER_PORT:-5002}:5002"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5002/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped